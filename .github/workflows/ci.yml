name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install -e ".[dev]"

    - name: Run Ruff Linting
      run: uv run ruff check .

    - name: Run Bandit Security Analysis
      run: uv run bandit -r src/

    - name: Run Pytest with Coverage
      run: uv run pytest --cov=lh_hid_guard --cov-report=term-missing --cov-report=xml

    - name: Test CLI Installation
      run: |
        uv run lh-guard --help
        uv run lh-guard simulate --profile human --count 20 -o /tmp/test_human.json
        uv run lh-guard analyze-log /tmp/test_human.json --strict

