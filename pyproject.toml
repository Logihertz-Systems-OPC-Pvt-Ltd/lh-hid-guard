[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-hid-guard"
version = "0.1.0"
description = "Analyzes Linux udev rules, USB device descriptors (lsusb/sysfs snapshots), and USBGuard policies to detect BadUSB keystroke injection vectors, unauthorized HID interfaces, and unrestricted DMA/mass-storage classes."
readme = "README.md"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-hid-guard"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-hid-guard"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-hid-guard#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-hid-guard/issues"

[project.scripts]
lh-guard = "lh_hid_guard.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311"]
